name: Windows CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.13
      - name: Sync development environment
        run: uv sync --frozen --extra studio --extra text2image --extra rig
      - name: Version lockstep
        run: uv run python scripts/preflight.py --fast
      - name: Default test suite
        run: uv run pytest -q
      - name: Build wheel
        run: uv build
