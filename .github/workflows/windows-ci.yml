name: Windows CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.13
      - name: Sync development environment
        run: uv sync --frozen --extra studio --extra text2image --extra rig --extra music
      - name: Version lockstep
        run: uv run python scripts/preflight.py --fast
      # **The worker count is the runner's, not the developer's.** ``addopts``
      # pins ``-n 8`` for a 63.5 GB workstation; ``windows-latest`` is 4 vCPU
      # and 16 GB, and eight workers each importing torch is how this step came
      # to die with ``INTERNALERROR> KeyError: <WorkerController gw9>`` -- xdist
      # replacing workers that had been killed, then indexing a scheduler table
      # the replacements were never added to. The gw*9* is the tell: with eight
      # workers there is no gw9 until two have already been replaced.
      #
      # The timeout is raised for the same reason and not because any test got
      # slower: 120 s is generous on an unloaded workstation and marginal on a
      # shared runner, and a test killed by the timeout is one of the ways a
      # worker dies.
      - name: Default test suite
        run: uv run pytest -q -n 4 --timeout 300
      - name: Build wheel and sdist
        run: uv build
      # The wheel "built" here was never proven to import, let alone run --
      # so a packaging mistake (a missing force-include, a module outside
      # ``packages``) shipped green. Installed into a *clean* venv rather than
      # the development one, which is the only arrangement where the source
      # tree cannot stand in for a file the wheel forgot.
      #
      # **The assertions moved into a script on 2026-09-05** and this step
      # calls it, because ``scripts/rebuild.ps1`` runs this whole workflow
      # locally before a push: a second copy of them in that driver would be a
      # local pass that stopped meaning anything the month this one changed.
      # (This step is also where a wrong assertion once sat unnoticed -- the
      # suite above fails first on a runner, so it was rarely reached.)
      - name: Wheel install smoke test
        run: uv run python scripts/wheel_smoke.py

  # **The 3.12 floor leg was retired on 2026-09-03, not deleted for quiet.**
  # It was added 2026-08-24 to run the suite under the declared floor without
  # the ``rig`` extra, and its first read was on 2026-09-03: fourteen failures,
  # six of them rig paths that fail rather than skip when bpy is absent. Since
  # bpy is 3.13-only and the installer packs its own 3.13 runtime, nothing that
  # ships was ever on 3.12 -- so ``requires-python`` moved to >=3.13 and the
  # leg has no floor left to test. If the floor is ever lowered again, this leg
  # comes back with it; a support claim with no run behind it is what was
  # wrong here in the first place.
