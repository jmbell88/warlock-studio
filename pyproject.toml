[project]
name = "warlock"
version = "0.0.37"
description = "Local AI 3D asset generator (Meshy-style) for game development"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU :: NVIDIA CUDA",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Games/Entertainment",
]
dependencies = [
    # The trellis-server.exe subprocess speaks HTTP on a local port; this is
    # the client for it, not a web framework left over from the browser build.
    "httpx>=0.27",
    "pillow>=10.0",
    "trimesh>=4.4",
    # The CSG backend behind Clay's Union Objects. trimesh.boolean dispatches to
    # an engine and ships none: without this, ``engine="manifold"`` raises at
    # call time rather than at import -- the same shape as scipy below, and the
    # same reason it is core rather than an extra. Clay is part of the base app.
    "manifold3d>=2.5",
    "numpy>=1.26",
    # QHull, via trimesh's convex_hull. The collision-mesh export is a convex
    # hull and trimesh delegates the hull itself to scipy.spatial -- without
    # this it raises ModuleNotFoundError at call time rather than at import.
    "scipy>=1.11",
    # Flood fill, connected components and Canny. Core rather than part of the
    # text2image extra because pipelines/reference.py measures every job's
    # reference before the trellis upload, and that path never touches torch.
    # The headless build on purpose: the GUI one drags in Qt.
    "opencv-python-headless>=4.10",
    # Reading and writing audio files outside the music extra. Muse's audition
    # decodes a finished take in the app process, and the loop/stem exports
    # write from it -- neither path touches torch, and both must work on the
    # documented dev install, which does not include `music`. Core for the same
    # reason scipy and opencv are: a small self-contained wheel on a path that
    # would otherwise raise ModuleNotFoundError at call time.
    "soundfile>=0.12",
    # The fetch worker imports snapshot_download directly.  Keeping this as a
    # direct dependency prevents model downloads from depending on whichever
    # optional ML package happens to pull the Hub client in transitively.
    "huggingface-hub>=0.34",
]

[project.optional-dependencies]
# Text-to-image stage (SDXL-class checkpoints). Heavy: torch cu128 + diffusers.
text2image = [
    "torch>=2.7",
    "diffusers>=0.31",
    "transformers>=4.44",
    "accelerate>=0.34",
    # Required by load_lora_weights(); diffusers does not pull it in itself.
    "peft>=0.13",
    "sentencepiece>=0.2",
    "protobuf>=4.0",
    # The host matting stack (pipelines/matting.py). BiRefNet is loaded with
    # trust_remote_code, so the modelling code that builds it is the
    # checkpoint's own and its imports are not visible to any resolver:
    # einops, kornia and timm are what that code reaches for, and without them
    # _load raised ModuleNotFoundError on a machine where doctor could see
    # every weight on disk. Declared here rather than left to the "you may
    # also need" line in models.MATTING_MODELS, which was the only thing
    # keeping the fallback-to-corner-fill from being permanent.
    "einops>=0.8",
    "kornia>=0.7",
    "timm>=1.0",
    # Not only BiRefNet's: transformers builds its fast image processors on
    # torchvision, which is the import bench/metrics._dino_model needs and
    # queue._rank_candidate silently swallows -- candidate ranking degrades to
    # composition alone with nothing on screen to say why. It was present in
    # the venv and absent from this file, so any `uv sync` removed it.
    "torchvision>=0.20",
]
# Muse: ACE-Step v1 text-to-music, vendored under pipelines/acestep/ and run in
# its own subprocess. Its own extra rather than folded into text2image: the two
# share torch and diffusers but nothing else, and a user who only wants images
# should not be made to install a lyric-language stack.
music = [
    "torch>=2.7",
    "diffusers>=0.31",
    "transformers>=4.44",
    "accelerate>=0.34",
    "peft>=0.13",
    # <2.9: as of 2.9 torchaudio.save dropped the soundfile/sox backends for
    # TorchCodec-only encoding, and the vendored pipeline_ace_step.py calls
    # torchaudio.save(..., backend="soundfile") -- upstream ACE-Step code, so
    # the fix is pinning the dependency rather than patching the vendor copy
    # (see acestep/ATTRIBUTION.md).
    #
    # There is a second, independent reason, and it is here so that a future
    # bump made to fix the first one does not silently delete a feature:
    # `torchaudio.models.hdemucs_high` is the stem separator behind Muse's
    # Separate action. It is a model class, not a backend, and it is gone from
    # the same release. Bumping past 2.9 means vendoring it under
    # `pipelines/hdemucs/` the way ACE-Step is vendored.
    "torchaudio>=2.7,<2.9",
    "librosa>=0.10",
    # soundfile is a core dependency; the extra inherits it.
    "loguru>=0.7",
    # The lyric-language stack. Heavy for a first cut that may only ever see
    # English lyrics, but `pipeline_ace_step` imports `language_segmentation`
    # and the lyric tokenizer unconditionally, so trimming it would mean a
    # fourth vendored modification -- and silently mangling non-English lyrics
    # with no error is worse than the install size.
    # 0.4 renamed LanguageIdentifier.from_pickled_model to from_model_file;
    # the vendored language_segmentation/LangSegment.py is upstream ACE-Step
    # byte-for-byte and still calls the old name (see acestep/ATTRIBUTION.md --
    # patching it would be an undocumented fourth vendored modification).
    "py3langid>=0.2,<0.4",
    "pypinyin>=0.53",
    "num2words>=0.5",
    "hangul-romanize>=0.1",
    "cutlet>=0.4",
    "fugashi[unidic-lite]>=1.3",
    "spacy>=3.7",
]
# The desktop app: one window, one GL context, no browser. imgui-bundle draws
# the panels and moderngl draws the viewport into an FBO the panels then show
# as a texture -- which is why they have to share a context and therefore a
# window, and why this is one extra rather than three.
#
# An extra rather than a core dependency because `warlock doctor` and `warlock
# sweep` have to work on a machine with no display: cli.py imports the window
# only on the path that opens one.
studio = [
    "moderngl>=5.10",
    "pygame-ce>=2.5",
    "imgui-bundle>=1.6",
    # Reading zstd-compressed Tiled layer data. A wheel, not a download, so the
    # offline invariant is untouched -- and imported lazily at the one call
    # site, so a checkout without the studio extra still imports the plotter.
    "zstandard>=0.22",
]
# Skeleton fitting and skinning. bpy ships cp313 wheels only.
#
# **The floor was 3.12 until 2026-09-03, and the claim had never been run.**
# The CI leg added to test it was read for the first time that day and was not
# green: fourteen failures, six of them rig paths that fail rather than skip
# when bpy is absent -- which is the "rigging unavailable" degradation the 3.12
# floor existed to keep working. Since bpy is 3.13-only, rigging can never work
# on 3.12; since the installer packs its own 3.13 runtime, no user of the
# shipped product is on 3.12 either. So the floor is 3.13 and the claim matches
# what is actually exercised, rather than the reverse.
#
# The upper bound stays: bpy's wheels declare Requires-Python >=3.13,<3.14, and
# an unmarked requirement would make the whole project unresolvable on 3.14
# rather than leaving rigging out of it.
rig = [
    "bpy>=5.2; python_version >= '3.13' and python_version < '3.14'",
]

# A dependency group rather than an extra, because `uv sync` installs the
# default groups and *not* extras: as an extra, `uv run pytest` on a fresh
# clone failed with "No module named pytest" until someone knew to add
# `--extra dev`. `dev` is uv's default group, so a plain `uv sync` now brings
# the test tooling with it.
[dependency-groups]
dev = [
    # Reads the vendored TTFs' cmaps in tests/test_fonts.py, and backs
    # scripts/strip_font_pua.py. Never imported by src/.
    "fonttools>=4.50",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.6",
    "ruff>=0.6",
]

[project.scripts]
warlock = "warlock.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# **The sdist needs an explicit file list, and its absence was a licensing
# incident rather than a tidiness problem.** hatchling's sdist default is
# "everything git does not ignore", and ``.gitignore`` says nothing about
# ``examples/`` -- so ``uv build`` swept 20 tracked sample files, ~26 MB, into
# every source distribution. Among them were Nintendo-derived game art and
# ULPC assets under CC-BY-SA/GPL with no attribution travelling beside them.
# The wheel was always clean (``packages`` below scopes it) and so was the
# installer (``installer/build.ps1`` stages three directories by name); the
# sdist was the one output nobody had written a rule for, and CI builds one on
# every push.
#
# An allowlist rather than an exclude list, deliberately: an exclude only stops
# what somebody thought of, and the failure mode here is a directory nobody
# thought of. ``tests/test_release_hygiene.py`` pins it.
[tool.hatch.build.targets.sdist]
include = [
    "/src/warlock",
    "/tests",
    "/docs",
    "/scripts",
    "/native",
    "/installer",
    "/README.md",
    "/CHANGELOG.md",
    "/CLAUDE.md",
    "/TODO.md",
    "/LICENSE",
    "/THIRD-PARTY-NOTICES.md",
    "/pyproject.toml",
    "/uv.lock",
]

[tool.hatch.build.targets.wheel]
packages = ["src/warlock"]

[tool.hatch.build.targets.wheel.force-include]
"docs/manual" = "warlock/manual"
# The same bargain the manual makes: canonical at the repo root where GitHub
# renders it, force-included so an installed wheel can still show it. Home's
# "What's new" block reads it through ``warlock.changelog``.
"CHANGELOG.md" = "warlock/CHANGELOG.md"

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
# From the same index as torch, and not optional: a torchvision built against
# another CUDA build of torch fails at import with an operator-registry error,
# which reads as a broken install rather than a mismatched wheel.
torchvision = [{ index = "pytorch-cu128" }]
# Same reasoning: an unrouted torchaudio resolves to PyPI's CPU-only wheel,
# which then chokes on the CUDA tensors the rest of the pipeline hands it.
torchaudio = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored third-party source, kept byte-for-byte apart from four marked
# modifications (see src/warlock/pipelines/birefnet/ATTRIBUTION.md). Linting it
# would mean reformatting it, and a reformatted vendor copy is one nobody can
# diff against upstream -- which is the entire reason it is in the tree.
extend-exclude = [
    "src/warlock/pipelines/birefnet/modeling.py",
    "src/warlock/pipelines/birefnet/configuration.py",
    "src/warlock/pipelines/acestep/**",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "gpu: requires local GPU + model weights (opt in with '-m gpu -n 0')",
    "perf: asserts a wall-clock budget; run serially with '-m perf -n 0'",
]
# The marker was registered and nothing excluded it, so "deselected by default"
# was true only on a host that could not run them: on an unprovisioned machine
# the gpu tests skipped at a fixture and looked deselected, while a provisioned
# one silently ran real 7 GB model loads inside `uv run pytest`. Both gpu test
# modules' docstrings claimed the deselection, so the claim is made true here
# rather than deleted. `-m gpu` on the command line overrides this (pytest takes
# the last -m it is given), which is the documented way to run the lane.
#
# `perf` joins it for the opposite reason: those tests assert a wall-clock
# budget, and a budget measured while fifteen sibling workers fight for the same
# cores is a measurement of the scheduler. They are still run, serially, by
# `uv run pytest -m perf -n 0`.
#
# `--dist loadfile` is not a tuning knob, it is what keeps two invariants true.
# Every test in a file lands on one worker, which preserves (a) "at most one
# imgui context alive at a time", upheld today by within-file ordering (see
# tests/test_section_blocks.py's imgui_ctx docstring -- two contexts over the
# one GL context crash the process), and (b) the module-level `_CACHE.clear()`
# couplings in test_bench_findings.py, test_changelog_cache.py and
# test_provenance.py. `--dist load` would scatter both.
#
# `--timeout 120` is a hang net rather than a budget: several tests spawn child
# interpreters, and a wedged one used to hold the whole run open. The slowest
# surviving test is ~5 s, so this only ever fires on a genuine hang.
#
# A single test is quicker without the workers: `uv run pytest path::name -n 0`.
#
# Eight workers, measured, not `auto`. The curve on this 24-core machine is
# 4 -> 71.9 s, 6 -> 59.7 s, 8 -> 54.2 s, 10 -> 54.3 s, 12 -> 55.3 s,
# 16 -> 59.6 s, 24 (`auto`) -> 64.1 s: it flattens at eight and then gets
# *worse*, because past that point the run is paying for redundant interpreter
# startup and imports rather than running tests. `auto` is therefore both the
# slowest setting above six and the least safe one -- at 24 workers the suite
# intermittently failed on memory, twice in twelve runs (an 8192x8192xf32 canvas
# in test_inker_mode.py is 1 GiB by design, and this box idles at 53 of its 69.5
# GiB commit limit already). Eight is the fast answer and the sober one.
addopts = [
    "-m", "not gpu and not perf",
    "-n", "8",
    "--dist", "loadfile",
    "--timeout", "120",
]
