[project]
name = "warlock"
version = "0.0.18"
description = "Local AI 3D asset generator (Meshy-style) for game development"
requires-python = ">=3.12"
dependencies = [
    # The trellis-server.exe subprocess speaks HTTP on a local port; this is
    # the client for it, not a web framework left over from the browser build.
    "httpx>=0.27",
    "pillow>=10.0",
    "trimesh>=4.4",
    "numpy>=1.26",
    # QHull, via trimesh's convex_hull. The collision-mesh export is a convex
    # hull and trimesh delegates the hull itself to scipy.spatial -- without
    # this it raises ModuleNotFoundError at call time rather than at import.
    "scipy>=1.11",
    # Flood fill, connected components and Canny. Core rather than part of the
    # text2image extra because pipelines/reference.py measures every job's
    # reference before the trellis upload, and that path never touches torch.
    # The headless build on purpose: the GUI one drags in Qt.
    "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
# Text-to-image stage (SDXL-class checkpoints). Heavy: torch cu128 + diffusers.
text2image = [
    "torch>=2.7",
    "diffusers>=0.31",
    "transformers>=4.44",
    "accelerate>=0.34",
    # Required by load_lora_weights(); diffusers does not pull it in itself.
    "peft>=0.13",
    "sentencepiece>=0.2",
    "protobuf>=4.0",
    # The host matting stack (pipelines/matting.py). BiRefNet is loaded with
    # trust_remote_code, so the modelling code that builds it is the
    # checkpoint's own and its imports are not visible to any resolver:
    # einops, kornia and timm are what that code reaches for, and without them
    # _load raised ModuleNotFoundError on a machine where doctor could see
    # every weight on disk. Declared here rather than left to the "you may
    # also need" line in models.MATTING_MODELS, which was the only thing
    # keeping the fallback-to-corner-fill from being permanent.
    "einops>=0.8",
    "kornia>=0.7",
    "timm>=1.0",
    # Not only BiRefNet's: transformers builds its fast image processors on
    # torchvision, which is the import bench/metrics._dino_model needs and
    # queue._rank_candidate silently swallows -- candidate ranking degrades to
    # composition alone with nothing on screen to say why. It was present in
    # the venv and absent from this file, so any `uv sync` removed it.
    "torchvision>=0.20",
]
# The desktop app: one window, one GL context, no browser. imgui-bundle draws
# the panels and moderngl draws the viewport into an FBO the panels then show
# as a texture -- which is why they have to share a context and therefore a
# window, and why this is one extra rather than three.
#
# An extra rather than a core dependency because `warlock doctor` and `warlock
# sweep` have to work on a machine with no display: cli.py imports the window
# only on the path that opens one.
studio = [
    "moderngl>=5.10",
    "pygame-ce>=2.5",
    "imgui-bundle>=1.6",
]
# Skeleton fitting and skinning. bpy ships cp313 wheels only, so this extra
# effectively requires Python 3.13 even though the project floor stays 3.12 --
# everything else here runs fine on 3.12 and rigging degrades to "unavailable"
# rather than failing (see doctor.blender_check).
rig = [
    # The marker is not decoration: bpy's wheels declare
    # Requires-Python >=3.13,<3.14, so an unmarked requirement makes the whole
    # project unresolvable on 3.12 rather than just leaving rigging out of it.
    "bpy>=5.2; python_version >= '3.13' and python_version < '3.14'",
]

# A dependency group rather than an extra, because `uv sync` installs the
# default groups and *not* extras: as an extra, `uv run pytest` on a fresh
# clone failed with "No module named pytest" until someone knew to add
# `--extra dev`. `dev` is uv's default group, so a plain `uv sync` now brings
# the test tooling with it.
[dependency-groups]
dev = [
    # Reads the vendored TTFs' cmaps in tests/test_fonts.py, and backs
    # scripts/strip_font_pua.py. Never imported by src/.
    "fonttools>=4.50",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
warlock = "warlock.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warlock"]

[tool.hatch.build.targets.wheel.force-include]
"docs/manual" = "warlock/manual"
# The same bargain the manual makes: canonical at the repo root where GitHub
# renders it, force-included so an installed wheel can still show it. Home's
# "What's new" block reads it through ``warlock.changelog``.
"CHANGELOG.md" = "warlock/CHANGELOG.md"

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
# From the same index as torch, and not optional: a torchvision built against
# another CUDA build of torch fails at import with an operator-registry error,
# which reads as a broken install rather than a mismatched wheel.
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["gpu: requires local GPU + model weights (deselect with '-m \"not gpu\"')"]
