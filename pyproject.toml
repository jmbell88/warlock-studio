[project]
name = "animancer3d"
version = "0.0.1"
description = "Local AI 3D asset generator (Meshy-style) for game development"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
    "trimesh>=4.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]
# Text-to-image stage (Flux.1-schnell). Heavy: torch cu128 + diffusers.
text2image = [
    "torch>=2.7",
    "diffusers>=0.31",
    "transformers>=4.44",
    "accelerate>=0.34",
    "sentencepiece>=0.2",
    "protobuf>=4.0",
]

[project.scripts]
animancer3d = "animancer3d.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/animancer3d"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["gpu: requires local GPU + model weights (deselect with '-m \"not gpu\"')"]
