<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animancer3D</title>
<style>
  :root {
    --bg: #14151a; --panel: #1d1f27; --edge: #2c2f3a; --text: #e6e6ec;
    --muted: #9a9db0; --accent: #7c6cf0; --ok: #4cc38a; --err: #e5484d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, "Segoe UI", sans-serif;
    display: grid; grid-template-columns: 340px 1fr; height: 100vh;
  }
  aside {
    background: var(--panel); border-right: 1px solid var(--edge);
    padding: 20px; overflow-y: auto;
  }
  h1 { font-size: 18px; margin: 0 0 16px; letter-spacing: .5px; }
  h1 span { color: var(--accent); }
  fieldset { border: 1px solid var(--edge); border-radius: 8px; margin: 0 0 14px; padding: 12px; }
  legend { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; padding: 0 6px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 8px 0 4px; }
  textarea, input, select {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--edge); border-radius: 6px; padding: 8px; font: inherit;
  }
  textarea { resize: vertical; min-height: 64px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tabs button {
    flex: 1; background: var(--bg); color: var(--muted); border: 1px solid var(--edge);
    border-radius: 6px; padding: 8px; cursor: pointer; font: inherit;
  }
  .tabs button.active { color: var(--text); border-color: var(--accent); }
  #generate {
    width: 100%; padding: 10px; border: 0; border-radius: 8px; cursor: pointer;
    background: var(--accent); color: white; font: inherit; font-weight: 600;
  }
  #generate:disabled { opacity: .5; cursor: default; }
  #jobs { list-style: none; margin: 16px 0 0; padding: 0; }
  #jobs li {
    border: 1px solid var(--edge); border-radius: 8px; padding: 10px;
    margin-bottom: 8px; cursor: pointer; display: flex; gap: 10px; align-items: center;
  }
  #jobs li.selected { border-color: var(--accent); }
  #jobs img { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; background: var(--bg); }
  #jobs li > div:nth-child(2) { min-width: 0; flex: 1; }
  .job-title { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
  .status.queued  { color: var(--muted); }
  .status.running, .status.cancelling { color: var(--accent); }
  .status.done    { color: var(--ok); }
  .status.error, .status.cancelled { color: var(--err); }
  .job-stage {
    font-size: 11px; color: var(--muted); overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .job-error {
    font-size: 11px; color: var(--err); margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .job-actions { margin-left: auto; display: flex; gap: 4px; }
  .job-actions button {
    background: none; border: 1px solid var(--edge); border-radius: 4px;
    color: var(--muted); cursor: pointer; font-size: 11px; padding: 2px 6px;
  }
  main { position: relative; }
  #viewer { width: 100%; height: 100%; display: block; }
  #placeholder {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: var(--muted); pointer-events: none; text-align: center; padding: 24px;
  }

  /* --- progress --------------------------------------------------------- */
  .bar { height: 3px; background: var(--edge); border-radius: 2px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent);
             transition: width .45s linear; }
  .bar.indet > i { width: 35%; animation: a3d-indet 1.4s ease-in-out infinite; }
  .bar.mini { margin-top: 6px; }

  @keyframes a3d-spin { to { transform: rotate(360deg); } }
  @keyframes a3d-indet {
    0%   { margin-left: -35%; }
    100% { margin-left: 100%; }
  }

  .spinner {
    width: 34px; height: 34px; border-radius: 50%; margin: 0 auto 14px;
    border: 3px solid var(--edge); border-top-color: var(--accent);
    animation: a3d-spin .9s linear infinite;
  }
  /* The container is pointer-events:none so orbit controls keep working; the
     card re-enables them for its own buttons. */
  #ph-progress { pointer-events: auto; width: min(360px, 80%); }
  #ph-label { font-size: 15px; color: var(--text); margin-bottom: 10px; }
  #ph-detail { font-size: 12px; color: var(--muted); margin-top: 8px; min-height: 1.5em; }
  #ph-time {
    font-size: 12px; color: var(--muted); margin-top: 2px;
    font-variant-numeric: tabular-nums;
  }
  #ph-progress.failed #ph-label { color: var(--err); }
  #ph-progress.failed .spinner { animation: none; border-top-color: var(--err); }

  @media (prefers-reduced-motion: reduce) {
    .spinner { animation: none; }
    .bar.indet > i { animation: none; width: 100%; opacity: .4; }
    .bar > i { transition: none; }
  }
  #downloads {
    position: absolute; top: 16px; right: 16px; display: none; gap: 6px;
  }
  #downloads a {
    background: var(--panel); border: 1px solid var(--edge); border-radius: 8px;
    color: var(--text); padding: 8px 14px; text-decoration: none; font-size: 13px;
  }
  #downloads a:hover { border-color: var(--accent); }
</style>
</head>
<body>
<aside>
  <h1>Animancer<span>3D</span></h1>
  <div class="tabs">
    <button id="tab-text" class="active" type="button">Text&nbsp;→&nbsp;3D</button>
    <button id="tab-image" type="button">Image&nbsp;→&nbsp;3D</button>
  </div>
  <form id="form">
    <fieldset id="text-input">
      <legend>Prompt</legend>
      <textarea id="prompt" placeholder="a wooden treasure chest with iron bands, fantasy game prop"></textarea>
    </fieldset>
    <fieldset id="image-input" hidden>
      <legend>Reference image</legend>
      <input type="file" id="image" accept="image/*">
    </fieldset>
    <fieldset>
      <legend>Options</legend>
      <label for="resolution">Geometry resolution</label>
      <select id="resolution">
        <option value="512">512 — fast preview</option>
        <option value="1024" selected>1024 — standard</option>
        <option value="1536">1536 — max detail</option>
      </select>
      <label for="seed">Seed</label>
      <input type="number" id="seed" value="42">
    </fieldset>
    <button id="generate" type="submit">Generate</button>
  </form>
  <ul id="jobs"></ul>
</aside>
<main>
  <canvas id="viewer"></canvas>
  <div id="placeholder">
    <div id="ph-idle">Generate a model or select a finished job to preview it here.</div>
    <div id="ph-progress" hidden aria-live="polite">
      <div class="spinner"></div>
      <div id="ph-label">Starting</div>
      <div class="bar"><i></i></div>
      <div id="ph-detail"></div>
      <div id="ph-time"></div>
    </div>
  </div>
  <div id="downloads">
    <a id="dl-glb" download>GLB</a>
    <a id="dl-obj" download>OBJ</a>
    <a id="dl-stl" download>STL</a>
  </div>
</main>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
<script type="module" src="./app.js"></script>
</body>
</html>
